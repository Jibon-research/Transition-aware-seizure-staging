  <text x="64" y="151" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="47" font-weight="700">Temporal Staging of</text>
  <text x="64" y="207" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="47" font-weight="700">Epileptic Seizure Progression</text>
