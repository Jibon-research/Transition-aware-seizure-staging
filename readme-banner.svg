<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title description">
  <title id="title">Temporal Staging of Epileptic Seizure Progression</title>
  <desc id="description">Gradient banner for the ST-ATMR-Net EEG seizure staging research project.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10204b"/>
      <stop offset=".52" stop-color="#174c78"/>
      <stop offset="1" stop-color="#5a327f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55e6d1"/>
      <stop offset=".52" stop-color="#73b9ff"/>
      <stop offset="1" stop-color="#ff9ccc"/>
